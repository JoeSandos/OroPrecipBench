# 数据集配置
dataset:
  type: MyDataset
  input_path: dataset_root/part1-US-Great_Plains/test_data_in_ERA5.nc
  output_path: dataset_root/part1-US-Great_Plains/test_data_out.nc
  invariant_path: dataset_root/part1-US-Great_Plains/static_variables.nc
  stats_path: dataset_root/part1-US-Great_Plains/stats.json
  input_variables: ["tp", "t2m", "u10", "v10"]
  output_variables: ["tp"]
  invariant_variables: ["elevation", "lsm"]
  input_log_variables: ["tp"]
  output_log_variables: ["tp"]


generation:
  sampler_type: deterministic # 采样器类型: stochastic or deterministic
  # 最好 nproc-per-node(进程数) * seed_batch_size = num_ensembles
  num_ensembles: 8 # 生成样本的集合数量
  seed_batch_size: 8 # 每个批次的种子数量
  num_workers: 1
  checkpoint_dir: 
  output_path: generated/diffusion/
  
